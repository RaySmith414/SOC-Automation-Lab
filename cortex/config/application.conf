# Cortex configuration for the lab.
#
# No secret is stored in this file. ${NAME} values are read from the container
# environment, which docker-compose.yml fills from .env. The image adds the
# Elasticsearch URI (es_uri) before it includes this file.

play.http.secret.key = ${CORTEX_SECRET}

search {
  index = cortex
  user = elastic
  password = ${ELASTIC_PASSWORD}
}

play.http.parser.maxMemoryBuffer = 1M
play.http.parser.maxDiskBuffer = 1G

# The lab is served over plain HTTP on 127.0.0.1.
play.http.session.secure = false
play.filters.csrf.cookie.secure = false

# Basic authentication on the API lets scripts/setup/provision.py create the
# first organization and user without a browser session.
auth.method.basic = true

auth {
  provider = [local]
}

analyzer {
  urls = ["https://download.thehive-project.org/analyzers.json"]
}

responder {
  urls = ["https://download.thehive-project.org/responders.json"]
}

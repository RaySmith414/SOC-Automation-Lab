name: CI

on:
  push:
  workflow_dispatch:

# Read-only: no job in this workflow writes to the repository.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Lint and unit tests (Python ${{ matrix.python }})
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python: ["3.9", "3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
      - name: Install
        run: python -m pip install -r requirements-dev.txt
      - name: Lint
        run: ruff check .
      - name: Shell scripts
        run: shellcheck scripts/setup/*.sh
      - name: Test
        run: python -m pytest -q

  stack:
    name: Start the core stack and provision it
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - name: Kernel setting for Elasticsearch and OpenSearch
        run: sudo sysctl -w vm.max_map_count=262144
      - name: Generate secrets
        run: scripts/setup/init.sh
      - name: Docker versions and compose file check
        run: |
          docker version --format 'Docker Engine {{.Server.Version}}'
          docker compose version
          docker compose config --quiet
      - name: Pull images
        run: docker compose pull --quiet
      - name: Start the stack
        run: docker compose up -d --wait --wait-timeout 900
      - name: Smoke test
        run: scripts/setup/smoke_test.sh 300
      - name: Provision through the APIs, create a case from each template and run two Shuffle workflows
        run: |
          python -m pip install --quiet -r scripts/python/requirements.txt
          python scripts/setup/provision.py --self-test
      - name: A second run changes nothing
        run: python scripts/setup/provision.py --self-test
      - name: Resource use
        if: always()
        run: |
          free -m
          docker stats --no-stream --format 'table {{.Name}}\t{{.MemUsage}}\t{{.CPUPerc}}'
          docker system df
      - name: Diagnostics
        if: failure()
        run: |
          docker compose ps -a
          docker compose logs --no-color --tail 120
          docker logs --tail 80 soc-lab-shuffle-orborus 2>&1 | grep -v '"status":' | cut -c1-300
      - name: Containers and published ports
        if: always()
        run: docker ps -a --format '{{.Names}} | {{.Image}} | {{.Status}} | {{.Ports}}'
      - name: Stop the lab
        if: always()
        run: scripts/setup/stop.sh -v
      - name: Nothing is left behind
        run: |
          docker ps -a --format '{{.Names}} | {{.Image}} | {{.Status}}'
          docker network ls
          docker volume ls
          test "$(docker info --format '{{.Swarm.LocalNodeState}}')" = "inactive"
          test -z "$(docker ps -aq)"
          test -z "$(docker network ls -q --filter name=soc-lab)"
          test -z "$(docker volume ls -q --filter name=soc-lab)"

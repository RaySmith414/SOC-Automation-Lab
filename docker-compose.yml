version: '3.8'

# SOC Automation Lab - Docker Compose
# Includes: Shuffle SOAR, TheHive, Cortex, MISP, Wazuh, Elasticsearch

services:
  # ===========================================
  # ELASTICSEARCH - Backend for TheHive & Wazuh
  # ===========================================
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:7.17.9
    container_name: elasticsearch
    hostname: elasticsearch
    environment:
      - discovery.type=single-node
      - cluster.name=soc-lab
      - bootstrap.memory_lock=true
      - xpack.security.enabled=true
      - ELASTIC_PASSWORD=${ELASTIC_PASSWORD:-changeme}
      - "ES_JAVA_OPTS=-Xms1g -Xmx1g"
    ulimits:
      memlock:
        soft: -1
        hard: -1
      nofile:
        soft: 65536
        hard: 65536
    volumes:
      - elasticsearch-data:/usr/share/elasticsearch/data
    ports:
      - "9200:9200"
    networks:
      - soc-network
    healthcheck:
      test: ["CMD-SHELL", "curl -s http://localhost:9200/_cluster/health | grep -q 'green\\|yellow'"]
      interval: 30s
      timeout: 10s
      retries: 5
    restart: unless-stopped

  # ===========================================
  # CASSANDRA - Backend for TheHive
  # ===========================================
  cassandra:
    image: cassandra:4.0
    container_name: cassandra
    hostname: cassandra
    environment:
      - CASSANDRA_CLUSTER_NAME=thehive
      - MAX_HEAP_SIZE=1G
      - HEAP_NEWSIZE=256M
    volumes:
      - cassandra-data:/var/lib/cassandra
    networks:
      - soc-network
    healthcheck:
      test: ["CMD-SHELL", "cqlsh -e 'describe cluster'"]
      interval: 30s
      timeout: 10s
      retries: 5
    restart: unless-stopped

  # ===========================================
  # THEHIVE - Security Incident Response Platform
  # ===========================================
  thehive:
    image: strangebee/thehive:5.2
    container_name: thehive
    hostname: thehive
    depends_on:
      cassandra:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy
    environment:
      - JVM_OPTS=-Xms512m -Xmx1024m
    volumes:
      - ./thehive/config/application.conf:/etc/thehive/application.conf:ro
      - thehive-data:/opt/thp/thehive/data
    ports:
      - "9000:9000"
    networks:
      - soc-network
    restart: unless-stopped

  # ===========================================
  # CORTEX - Observable Analysis Engine
  # ===========================================
  cortex:
    image: thehiveproject/cortex:3.1.7
    container_name: cortex
    hostname: cortex
    depends_on:
      elasticsearch:
        condition: service_healthy
    environment:
      - job_directory=/tmp/cortex-jobs
    volumes:
      - cortex-data:/opt/cortex/data
      - /var/run/docker.sock:/var/run/docker.sock
    ports:
      - "9001:9001"
    networks:
      - soc-network
    restart: unless-stopped

  # ===========================================
  # MISP - Threat Intelligence Platform
  # ===========================================
  misp-db:
    image: mysql:8.0
    container_name: misp-db
    hostname: misp-db
    environment:
      - MYSQL_DATABASE=misp
      - MYSQL_USER=misp
      - MYSQL_PASSWORD=${MISP_DB_PASSWORD:-misp}
      - MYSQL_ROOT_PASSWORD=${MISP_DB_ROOT_PASSWORD:-misp_root}
    volumes:
      - misp-db-data:/var/lib/mysql
    networks:
      - soc-network
    restart: unless-stopped

  misp-redis:
    image: redis:7
    container_name: misp-redis
    hostname: misp-redis
    networks:
      - soc-network
    restart: unless-stopped

  misp:
    image: coolacid/misp-docker:core-latest
    container_name: misp
    hostname: misp
    depends_on:
      - misp-db
      - misp-redis
    environment:
      - MYSQL_HOST=misp-db
      - MYSQL_DATABASE=misp
      - MYSQL_USER=misp
      - MYSQL_PASSWORD=${MISP_DB_PASSWORD:-misp}
      - MISP_ADMIN_EMAIL=admin@admin.test
      - MISP_ADMIN_PASSPHRASE=${MISP_ADMIN_PASSWORD:-admin}
      - MISP_BASEURL=https://localhost
      - REDIS_FQDN=misp-redis
      - HOSTNAME=misp
    volumes:
      - misp-data:/var/www/MISP
    ports:
      - "8443:443"
      - "8080:80"
    networks:
      - soc-network
    restart: unless-stopped

  # ===========================================
  # SHUFFLE SOAR - Security Orchestration
  # ===========================================
  shuffle-database:
    image: opensearchproject/opensearch:2.11.0
    container_name: shuffle-database
    hostname: shuffle-database
    environment:
      - discovery.type=single-node
      - OPENSEARCH_JAVA_OPTS=-Xms512m -Xmx512m
      - plugins.security.disabled=true
      - DISABLE_SECURITY_PLUGIN=true
    volumes:
      - shuffle-database:/usr/share/opensearch/data
    networks:
      - soc-network
    restart: unless-stopped

  shuffle-backend:
    image: ghcr.io/shuffle/shuffle-backend:latest
    container_name: shuffle-backend
    hostname: shuffle-backend
    depends_on:
      - shuffle-database
    environment:
      - SHUFFLE_APP_HOTLOAD_FOLDER=/shuffle-apps
      - SHUFFLE_FILE_LOCATION=/shuffle-files
      - SHUFFLE_OPENSEARCH_URL=https://shuffle-database:9200
      - SHUFFLE_OPENSEARCH_SKIPSSL_VERIFY=true
      - SHUFFLE_ENCRYPTION_KEY=${SHUFFLE_ENCRYPTION_KEY:-shuffle_encryption_key_here}
      - SHUFFLE_DEFAULT_USERNAME=${SHUFFLE_USERNAME:-admin}
      - SHUFFLE_DEFAULT_PASSWORD=${SHUFFLE_PASSWORD:-shuffle}
      - SHUFFLE_DEFAULT_APIKEY=${SHUFFLE_API_KEY:-}
      - BACKEND_HOSTNAME=shuffle-backend
      - ORG_ID=Shuffle
      - SHUFFLE_DOWNLOAD_WORKFLOW_LOCATION=https://github.com/shuffle/workflows
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - shuffle-apps:/shuffle-apps
      - shuffle-files:/shuffle-files
    ports:
      - "5001:5001"
    networks:
      - soc-network
    restart: unless-stopped

  shuffle-frontend:
    image: ghcr.io/shuffle/shuffle-frontend:latest
    container_name: shuffle-frontend
    hostname: shuffle-frontend
    depends_on:
      - shuffle-backend
    environment:
      - BACKEND_HOSTNAME=shuffle-backend
    ports:
      - "3001:80"
      - "3443:443"
    networks:
      - soc-network
    restart: unless-stopped

  shuffle-orborus:
    image: ghcr.io/shuffle/shuffle-orborus:latest
    container_name: shuffle-orborus
    hostname: shuffle-orborus
    depends_on:
      - shuffle-backend
    environment:
      - SHUFFLE_APP_SDK_VERSION=1.2.0
      - SHUFFLE_WORKER_VERSION=latest
      - RUNNING_MODE=docker
      - SHUFFLE_BASE_URL=http://shuffle-backend:5001
      - SHUFFLE_ORBORUS_EXECUTION_TIMEOUT=120
      - ENVIRONMENT_NAME=Shuffle
      - ORG_ID=Shuffle
      - DOCKER_API_VERSION=1.40
      - CLEANUP=true
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - soc-network
    restart: unless-stopped

  # ===========================================
  # WAZUH - Security Monitoring
  # ===========================================
  wazuh-manager:
    image: wazuh/wazuh-manager:4.7.2
    container_name: wazuh-manager
    hostname: wazuh-manager
    environment:
      - INDEXER_URL=https://elasticsearch:9200
      - INDEXER_USERNAME=admin
      - INDEXER_PASSWORD=${ELASTIC_PASSWORD:-changeme}
      - FILEBEAT_SSL_VERIFICATION_MODE=none
      - API_USERNAME=${WAZUH_API_USER:-wazuh}
      - API_PASSWORD=${WAZUH_API_PASSWORD:-wazuh}
    volumes:
      - wazuh-api-configuration:/var/ossec/api/configuration
      - wazuh-etc:/var/ossec/etc
      - wazuh-logs:/var/ossec/logs
      - wazuh-queue:/var/ossec/queue
      - wazuh-var-multigroups:/var/ossec/var/multigroups
      - wazuh-integrations:/var/ossec/integrations
      - wazuh-active-response:/var/ossec/active-response/bin
      - wazuh-agentless:/var/ossec/agentless
      - wazuh-wodles:/var/ossec/wodles
      - wazuh-filebeat-etc:/etc/filebeat
      - wazuh-filebeat-var:/var/lib/filebeat
    ports:
      - "1514:1514/tcp"
      - "1514:1514/udp"
      - "1515:1515"
      - "514:514/udp"
      - "55000:55000"
    networks:
      - soc-network
    restart: unless-stopped

  wazuh-dashboard:
    image: wazuh/wazuh-dashboard:4.7.2
    container_name: wazuh-dashboard
    hostname: wazuh-dashboard
    depends_on:
      - elasticsearch
      - wazuh-manager
    environment:
      - INDEXER_URL=https://elasticsearch:9200
      - INDEXER_USERNAME=admin
      - INDEXER_PASSWORD=${ELASTIC_PASSWORD:-changeme}
      - WAZUH_API_URL=https://wazuh-manager
      - API_USERNAME=${WAZUH_API_USER:-wazuh}
      - API_PASSWORD=${WAZUH_API_PASSWORD:-wazuh}
      - DASHBOARD_USERNAME=kibanaserver
      - DASHBOARD_PASSWORD=kibanaserver
    volumes:
      - wazuh-dashboard-config:/usr/share/wazuh-dashboard/config
      - wazuh-dashboard-custom:/usr/share/wazuh-dashboard/plugins/wazuh/public/assets/custom
    ports:
      - "443:5601"
    networks:
      - soc-network
    restart: unless-stopped

  # ===========================================
  # GRAFANA - Metrics Dashboard (Optional)
  # ===========================================
  grafana:
    image: grafana/grafana:10.2.3
    container_name: grafana
    hostname: grafana
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD:-admin}
      - GF_INSTALL_PLUGINS=grafana-clock-panel,grafana-piechart-panel
    volumes:
      - grafana-data:/var/lib/grafana
    ports:
      - "3000:3000"
    networks:
      - soc-network
    restart: unless-stopped

# ===========================================
# NETWORKS
# ===========================================
networks:
  soc-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.0.0/16

# ===========================================
# VOLUMES
# ===========================================
volumes:
  # Elasticsearch
  elasticsearch-data:

  # Cassandra
  cassandra-data:

  # TheHive
  thehive-data:

  # Cortex
  cortex-data:

  # MISP
  misp-db-data:
  misp-data:

  # Shuffle
  shuffle-database:
  shuffle-apps:
  shuffle-files:

  # Wazuh
  wazuh-api-configuration:
  wazuh-etc:
  wazuh-logs:
  wazuh-queue:
  wazuh-var-multigroups:
  wazuh-integrations:
  wazuh-active-response:
  wazuh-agentless:
  wazuh-wodles:
  wazuh-filebeat-etc:
  wazuh-filebeat-var:
  wazuh-dashboard-config:
  wazuh-dashboard-custom:

  # Grafana
  grafana-data:

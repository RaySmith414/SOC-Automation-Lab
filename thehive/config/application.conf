# TheHive configuration for the lab.
#
# No secret is stored in this file. ${NAME} values are read from the container
# environment, which docker-compose.yml fills from .env.

play.http.secret.key = ${THEHIVE_SECRET}

# Graph database
db.janusgraph {
  storage {
    backend = cql
    hostname = ["cassandra"]
    cql {
      cluster-name = thp
      keyspace = thehive
    }
  }

  # Search index
  index.search {
    backend = elasticsearch
    hostname = ["elasticsearch"]
    index-name = thehive
    elasticsearch.http.auth {
      type = basic
      basic {
        username = elastic
        password = ${ELASTIC_PASSWORD}
      }
    }
  }
}

# Attachments
storage {
  provider = localfs
  localfs.location = /opt/thp/thehive/files
}

play.http.parser.maxDiskBuffer = 1GB
play.http.parser.maxMemoryBuffer = 256kB

# Connectors. The Cortex server itself is registered through the API by
# scripts/setup/provision.py, because its API key only exists after Cortex has
# been initialized.
scalligraph.modules += org.thp.thehive.connector.cortex.CortexModule

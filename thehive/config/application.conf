# TheHive Configuration
# SOC Automation Lab

# Secret key for session encryption
play.http.secret.key = "changeme-in-production-use-strong-random-key"

# Database Configuration - Cassandra + Elasticsearch
db.janusgraph {
  storage {
    backend = cql
    hostname = ["cassandra"]
    cql {
      cluster-name = "thehive"
      keyspace = "thehive"
    }
  }

  index.search {
    backend = elasticsearch
    hostname = ["elasticsearch"]
    index-name = "thehive"
  }
}

# Storage for attachments
storage {
  provider = localfs
  localfs.location = /opt/thp/thehive/data
}

# Cortex Integration
play.modules.enabled += org.thp.thehive.connector.cortex.CortexModule

cortex {
  servers = [
    {
      name = "Cortex-Local"
      url = "http://cortex:9001"
      auth {
        type = "bearer"
        key = ${?CORTEX_API_KEY}
      }
      wsConfig {
        ssl.loose.acceptAnyCertificate = true
      }
      refreshDelay = 5 seconds
      maxRetryOnError = 3
      statusCheckInterval = 30 seconds
    }
  ]
}

# MISP Integration
play.modules.enabled += org.thp.thehive.connector.misp.MispModule

misp {
  interval = 1 hour
  servers = [
    {
      name = "MISP-Local"
      url = "https://misp"
      auth {
        type = "key"
        key = ${?MISP_API_KEY}
      }
      wsConfig {
        ssl.loose.acceptAnyCertificate = true
      }
      purpose = ImportAndExport
      caseTemplate = "MISP Event"
      tags = ["misp", "threat-intel"]
      exportCaseTags = true
      exportObservableTags = true
      includedTheHiveOrganisations = ["*"]
      excludedTheHiveOrganisations = []
      includedMispOrganisations = ["*"]
      excludedMispOrganisations = []
      maxAge = 7 days
      maxAttributes = 1000
      maxSize = 1 MiB
    }
  ]
}

# Webhook Notifications
notification.webhook.endpoints = [
  {
    name = "Shuffle-Webhook"
    url = "http://shuffle-backend:5001/api/v1/hooks/webhook_thehive"
    version = 0
    wsConfig {
      ssl.loose.acceptAnyCertificate = true
    }
    auth {
      type = "bearer"
      key = ${?SHUFFLE_WEBHOOK_KEY}
    }
    includedTheHiveOrganisations = ["*"]
    excludedTheHiveOrganisations = []
  }
]

# Authentication
auth {
  providers = [
    {name: session}
    {name: basic, realm: thehive}
    {name: local}
    {name: key}
  ]

  # Multi-factor authentication (optional)
  # mfa.enabled = true

  # LDAP configuration (optional)
  # ldap {
  #   servers = ["ldap://ldap.company.com:389"]
  #   bindDN = "cn=admin,dc=company,dc=com"
  #   bindPW = "password"
  #   baseDN = "ou=users,dc=company,dc=com"
  #   filter = "(uid={0})"
  # }
}

# User Session
session {
  warning = 5m
  inactivity = 1h
}

# Service Configuration
application {
  baseUrl = "http://localhost:9000"
}

# Organisation defaults
organisation {
  defaults {
    caseNumberFormat = "CASE-%06d"
  }
}

# Case Configuration
case {
  # Custom fields
  customFields = [
    {
      name = "business-unit"
      displayName = "Business Unit"
      type = "string"
      options = ["IT", "Finance", "HR", "Operations", "Executive"]
      mandatory = false
    }
    {
      name = "affected-systems"
      displayName = "Affected Systems"
      type = "integer"
      mandatory = false
    }
    {
      name = "data-classification"
      displayName = "Data Classification"
      type = "string"
      options = ["Public", "Internal", "Confidential", "Restricted"]
      mandatory = false
    }
    {
      name = "attack-vector"
      displayName = "Attack Vector"
      type = "string"
      options = ["Phishing", "Malware", "Exploitation", "Insider", "Physical", "Unknown"]
      mandatory = false
    }
    {
      name = "mitre-tactics"
      displayName = "MITRE ATT&CK Tactics"
      type = "string"
      mandatory = false
    }
  ]
}

# Alert Configuration
alert {
  # Similarity threshold for alert deduplication
  similarityThreshold = 0.7

  # Auto-merge similar alerts
  autoMerge = false
}

# Observable Configuration
observable {
  # Data types
  types = [
    "autonomous-system"
    "domain"
    "file"
    "filename"
    "fqdn"
    "hash"
    "hostname"
    "ip"
    "mail"
    "mail-subject"
    "other"
    "regexp"
    "registry"
    "uri_path"
    "url"
    "user-agent"
  ]
}

# Metrics and Statistics
metrics {
  enabled = true
  name = "thehive"
}

# Streaming API
stream.longPolling {
  refresh = 1 second
  maxWait = 1 minute
}

# Play Framework Configuration
play {
  http {
    parser.maxMemoryBuffer = 128M
    parser.maxDiskBuffer = 256M
  }

  filters {
    enabled += play.filters.gzip.GzipFilter

    gzip {
      contentType {
        whiteList = ["text/*", "application/javascript", "application/json"]
      }
    }
  }
}

# Akka Configuration
akka {
  loglevel = "INFO"

  actor {
    provider = "local"
  }
}

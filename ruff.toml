line-length = 120
target-version = "py39"

[lint]
select = ["E", "F", "W", "I", "B", "S", "UP"]
# The scripts keep Python 3.9 typing syntax, so the typing upgrades are off.
ignore = ["UP006", "UP007", "UP035", "UP045"]

[lint.per-file-ignores]
"tests/*" = ["S", "E501"]

[lint.isort]
known-first-party = ["ioc_extractor", "threat_enrichment", "automated_blocking"]
